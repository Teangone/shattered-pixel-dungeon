name: Build Shattered Pixel Dungeon iOS (Unsigned IPA)
run-name: ${{ github.actor }} build iOS IPA
on:
  workflow_dispatch: # 手动触发（推荐，你点按钮才编译）
  # push:
  #   branches: [ master ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '14.3.1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build iOS unsigned IPA via RoboVM
        run: |
          chmod +x gradlew
          ./gradlew ios:createIPA -Probovm.skipSigning=true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pd-unsigned-ipa
          path: ios/build/robovm/ipa/*.ipa
          retention-days: 7
